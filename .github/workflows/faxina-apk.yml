name: Faxina APK

# Compila o app Faxina (pasta faxina/) e publica o APK pronto para baixar no celular:
#  - como artefato da execução; e
#  - na Release "faxina-latest" (sempre a versão mais recente).
on:
  push:
    paths:
      - 'faxina/**'
      - '.github/workflows/faxina-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faxina-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faxina
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo (varredura, duplicados, IMAP)
        run: ./gradlew :core:selfTest --stacktrace

      - name: Gerar APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Conferir e nomear o APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "APK não encontrado"; exit 1; }
          cp "$APK" Faxina.apk
          ls -l Faxina.apk
          echo "size=$(stat -c %s Faxina.apk)" >> "$GITHUB_OUTPUT"

      - name: Guardar o APK na execução
        uses: actions/upload-artifact@v4
        with:
          name: Faxina-apk
          path: faxina/Faxina.apk
          if-no-files-found: error

      - name: Publicar na Release "faxina-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete faxina-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create faxina-latest Faxina.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Faxina — APK mais recente" \
            --notes "Baixe o arquivo **Faxina.apk** abaixo e instale no celular (veja faxina/README.md). Compilado do commit ${GITHUB_SHA::7} em $(date -u +'%d/%m/%Y %H:%M') UTC."
