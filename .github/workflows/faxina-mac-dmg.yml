name: Faxina Mac DMG (reutilizável)

# Chamado por faxina-mac.yml: empacota, assina (ad-hoc) e publica um DMG para uma arquitetura.
on:
  workflow_call:
    inputs:
      name:
        type: string
        required: true
        description: "Intel ou AppleSilicon (vira parte do nome do arquivo)"
      os:
        type: string
        required: true
        description: "Rótulo do runner do GitHub"

permissions:
  contents: write

jobs:
  dmg:
    name: DMG (${{ inputs.name }}, ${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        working-directory: faxina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Empacotar o app
        run: |
          set -o pipefail
          ./gradlew :mac:createDistributable --stacktrace 2>&1 | tee ../dmg-build.log

      - name: Assinar (ad-hoc) e criar o DMG
        run: |
          APP=$(find mac/build/compose/binaries -maxdepth 5 -name 'Faxina.app' | head -n 1)
          test -n "$APP" || { echo "Faxina.app não encontrado"; exit 1; }
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf dmgroot && mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Faxina" -srcfolder dmgroot -ov -format UDZO "Faxina-Mac-${{ inputs.name }}.dmg"
          ls -l Faxina-Mac-*.dmg
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Teste de fumaça (abre o app por 15 s)
        continue-on-error: true
        run: |
          "$APP_PATH/Contents/MacOS/Faxina" > ../smoke.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "App continua rodando: OK"; kill $PID; else echo "O app fechou sozinho!"; cat ../smoke.log; exit 1; fi
          cat ../smoke.log

      - name: Guardar o DMG
        uses: actions/upload-artifact@v4
        with:
          name: Faxina-Mac-${{ inputs.name }}-${{ inputs.os }}
          path: faxina/Faxina-Mac-${{ inputs.name }}.dmg
          if-no-files-found: error

      - name: Publicar na Release "faxina-mac-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Escolha o arquivo certo: **Faxina-Mac-AppleSilicon.dmg** (chip M1/M2/M3/M4) ou **Faxina-Mac-Intel.dmg** (processador Intel). Veja faxina/README.md para instalar. Último build: commit ${GITHUB_SHA::7} em $(date -u +'%d/%m/%Y %H:%M') UTC."
          gh release view faxina-mac-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create faxina-mac-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Faxina para Mac — instaladores mais recentes" --notes "$NOTES" || true
          gh release upload faxina-mac-latest "Faxina-Mac-${{ inputs.name }}.dmg" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit faxina-mac-latest --repo "$GITHUB_REPOSITORY" --notes "$NOTES" || true

      - name: Publicar log do build
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view faxina-ci-logs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create faxina-ci-logs --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Registros do CI (temporário)" --notes "Prévias de tela e logs de build. Pode ser apagado."
          cp dmg-build.log "mac-${{ inputs.name }}-build.log" || true
          cp smoke.log "mac-${{ inputs.name }}-smoke.log" || true
          gh release upload faxina-ci-logs mac-${{ inputs.name }}-*.log --clobber --repo "$GITHUB_REPOSITORY" || true
