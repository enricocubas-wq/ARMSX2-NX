name: APK da árvore genealógica

# Compila o app Android (arvore-genealogica/android) e publica o APK numa release
# chamada "arvore-genealogica-apk", com link direto para baixar no celular.

on:
  push:
    branches:
      - master
      - claude/genealogy-app-registration-1h13hr
    paths:
      - 'arvore-genealogica/**'
      - '.github/workflows/arvore-genealogica-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arvore-genealogica-apk
  cancel-in-progress: true

env:
  # Protege só uma chave de uso pessoal que fica no cache do próprio repositório.
  ARVORE_KEYSTORE_PASSWORD: arvore-genealogica-chave-pessoal

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout of code
        uses: actions/checkout@v5

      - name: Rodar os testes do app
        working-directory: arvore-genealogica
        run: npm test

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Este build usa o "gradle" instalado acima, nunca um gradle-wrapper.jar. A validação
          # varreria o repositório todo e reprovaria um wrapper de terceiros do emulador (SDL3).
          validate-wrappers: false

      - name: Copiar o app web para dentro do projeto Android
        run: sh arvore-genealogica/android/sync-web.sh

      # A chave de assinatura precisa ser sempre a mesma: o Android só aceita instalar um APK
      # novo por cima do antigo (sem apagar os dados) se os dois forem assinados pela mesma chave.
      - name: Recuperar a chave de assinatura do cache
        uses: actions/cache@v4
        with:
          path: ~/arvore.keystore
          key: arvore-genealogica-keystore-v1

      - name: Criar a chave de assinatura (só na primeira vez)
        run: |
          if [ ! -f "$HOME/arvore.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/arvore.keystore" \
              -storepass "$ARVORE_KEYSTORE_PASSWORD" -keypass "$ARVORE_KEYSTORE_PASSWORD" \
              -alias arvore -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Arvore Genealogica"
            echo "Chave nova criada."
          else
            echo "Chave existente recuperada do cache."
          fi

      - name: Aceitar as licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar o APK
        working-directory: arvore-genealogica/android
        run: |
          export ARVORE_KEYSTORE="$HOME/arvore.keystore"
          gradle assembleRelease -PappVersionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Conferir a assinatura do APK
        run: |
          APK=arvore-genealogica/android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          "$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner" verify --verbose --print-certs "$APK" | head -8

      - name: Publicar o APK numa release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=arvore-genealogica-apk
          cp arvore-genealogica/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/arvore-genealogica.apk"
          gh release delete "$TAG" --yes --cleanup-tag || true
          # --prerelease: não vira a "última release" do repositório do emulador.
          gh release create "$TAG" "$RUNNER_TEMP/arvore-genealogica.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Árvore genealógica (APK para Android)" \
            --notes "APK da árvore genealógica (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}). Baixe no celular, abra o arquivo e permita a instalação de apps desta fonte. O app não tem permissão de internet: os dados ficam só no aparelho."
          echo "Link: https://github.com/${{ github.repository }}/releases/download/$TAG/arvore-genealogica.apk"
