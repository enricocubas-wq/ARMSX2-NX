name: Faxina Mac

# Compila o app do Mac (faxina/mac) e publica os instaladores .dmg na Release "faxina-mac-latest":
#  - Faxina-Mac-AppleSilicon.dmg  (Macs com chip M1/M2/M3/M4)
#  - Faxina-Mac-Intel.dmg         (Macs com processador Intel)
# Também roda os testes do núcleo e gera prévias das telas (Release "faxina-ci-logs").
on:
  push:
    paths:
      - 'faxina/**'
      - '!faxina/app/**'
      - '.github/workflows/faxina-mac.yml'
      - '.github/workflows/faxina-mac-dmg.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faxina-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Testes e prévias das telas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faxina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Bibliotecas gráficas e fontes para renderizar as prévias
        run: sudo apt-get update -y && sudo apt-get install -y libgl1 libxrender1 libxtst6 libxi6 libfontconfig1 fonts-dejavu-core

      - name: Testes do núcleo e compilação do app do Mac
        run: |
          set -o pipefail
          ./gradlew :core:selfTest :mac:compileKotlin --stacktrace 2>&1 | tee ../preview-build.log

      - name: Gerar prévias das telas
        run: |
          set -o pipefail
          ./gradlew :mac:previewShots -PshotsDir="$GITHUB_WORKSPACE/shots" --stacktrace 2>&1 | tee -a ../preview-build.log

      - name: Publicar prévias e log (Release de registros do CI)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view faxina-ci-logs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create faxina-ci-logs --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Registros do CI (temporário)" --notes "Prévias de tela e logs de build. Pode ser apagado."
          cp preview-build.log mac-preview-build.log || true
          gh release upload faxina-ci-logs mac-preview-build.log shots/*.png --clobber --repo "$GITHUB_REPOSITORY" || true

  intel:
    name: DMG Intel
    uses: ./.github/workflows/faxina-mac-dmg.yml
    with:
      name: Intel
      os: macos-15-intel

  # Os runners Apple Silicon do GitHub andam com pouca capacidade: o job pode ser cancelado por falta de
  # máquina. Tentamos em até 3 rodadas (macos-15 e macos-26 ao mesmo tempo); parou de tentar quando uma der certo.
  arm1a:
    name: DMG Apple Silicon (rodada 1, macos-15)
    uses: ./.github/workflows/faxina-mac-dmg.yml
    with:
      name: AppleSilicon
      os: macos-15
  arm1b:
    name: DMG Apple Silicon (rodada 1, macos-26)
    uses: ./.github/workflows/faxina-mac-dmg.yml
    with:
      name: AppleSilicon
      os: macos-26

  arm2a:
    name: DMG Apple Silicon (rodada 2, macos-15)
    needs: [arm1a, arm1b]
    if: ${{ !cancelled() && needs.arm1a.result != 'success' && needs.arm1b.result != 'success' }}
    uses: ./.github/workflows/faxina-mac-dmg.yml
    with:
      name: AppleSilicon
      os: macos-15
  arm2b:
    name: DMG Apple Silicon (rodada 2, macos-26)
    needs: [arm1a, arm1b]
    if: ${{ !cancelled() && needs.arm1a.result != 'success' && needs.arm1b.result != 'success' }}
    uses: ./.github/workflows/faxina-mac-dmg.yml
    with:
      name: AppleSilicon
      os: macos-26

  arm3a:
    name: DMG Apple Silicon (rodada 3, macos-15)
    needs: [arm1a, arm1b, arm2a, arm2b]
    if: ${{ !cancelled() && needs.arm1a.result != 'success' && needs.arm1b.result != 'success' && needs.arm2a.result != 'success' && needs.arm2b.result != 'success' }}
    uses: ./.github/workflows/faxina-mac-dmg.yml
    with:
      name: AppleSilicon
      os: macos-15
  arm3b:
    name: DMG Apple Silicon (rodada 3, macos-26)
    needs: [arm1a, arm1b, arm2a, arm2b]
    if: ${{ !cancelled() && needs.arm1a.result != 'success' && needs.arm1b.result != 'success' && needs.arm2a.result != 'success' && needs.arm2b.result != 'success' }}
    uses: ./.github/workflows/faxina-mac-dmg.yml
    with:
      name: AppleSilicon
      os: macos-26
