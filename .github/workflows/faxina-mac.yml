name: Faxina Mac

# Compila o app do Mac (faxina/mac) e publica os instaladores .dmg na Release "faxina-mac-latest":
#  - Faxina-Mac-AppleSilicon.dmg  (Macs com chip M1/M2/M3/M4)
#  - Faxina-Mac-Intel.dmg         (Macs com processador Intel)
# Também roda os testes do núcleo e gera prévias das telas (Release "faxina-ci-logs").
on:
  push:
    paths:
      - 'faxina/**'
      - '!faxina/app/**'
      - '.github/workflows/faxina-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faxina-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Testes e prévias das telas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faxina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Bibliotecas gráficas e fontes para renderizar as prévias
        run: sudo apt-get update -y && sudo apt-get install -y libgl1 libxrender1 libxtst6 libxi6 libfontconfig1 fonts-dejavu-core

      - name: Testes do núcleo e compilação do app do Mac
        run: |
          set -o pipefail
          ./gradlew :core:selfTest :mac:compileKotlin --stacktrace 2>&1 | tee ../preview-build.log

      - name: Gerar prévias das telas
        run: |
          set -o pipefail
          ./gradlew :mac:previewShots -PshotsDir="$GITHUB_WORKSPACE/shots" --stacktrace 2>&1 | tee -a ../preview-build.log

      - name: Publicar prévias e log (Release de registros do CI)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view faxina-ci-logs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create faxina-ci-logs --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Registros do CI (temporário)" --notes "Prévias de tela e logs de build. Pode ser apagado."
          cp preview-build.log mac-preview-build.log || true
          gh release upload faxina-ci-logs mac-preview-build.log shots/*.png --clobber --repo "$GITHUB_REPOSITORY" || true

  dmg:
    name: DMG (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: AppleSilicon
          - os: macos-15-intel
            name: Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: faxina
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Empacotar o app
        run: |
          set -o pipefail
          ./gradlew :mac:createDistributable --stacktrace 2>&1 | tee ../dmg-build.log

      - name: Assinar (ad-hoc) e criar o DMG
        run: |
          APP=$(find mac/build/compose/binaries -maxdepth 5 -name 'Faxina.app' | head -n 1)
          test -n "$APP" || { echo "Faxina.app não encontrado"; exit 1; }
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf dmgroot && mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Faxina" -srcfolder dmgroot -ov -format UDZO "Faxina-Mac-${{ matrix.name }}.dmg"
          ls -l Faxina-Mac-*.dmg
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Teste de fumaça (abre o app por 15 s)
        continue-on-error: true
        run: |
          "$APP_PATH/Contents/MacOS/Faxina" > ../smoke.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "App continua rodando: OK"; kill $PID; else echo "O app fechou sozinho!"; cat ../smoke.log; exit 1; fi
          cat ../smoke.log

      - name: Guardar o DMG
        uses: actions/upload-artifact@v4
        with:
          name: Faxina-Mac-${{ matrix.name }}
          path: faxina/Faxina-Mac-${{ matrix.name }}.dmg
          if-no-files-found: error

      - name: Publicar log do build
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh release view faxina-ci-logs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create faxina-ci-logs --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Registros do CI (temporário)" --notes "Prévias de tela e logs de build. Pode ser apagado."
          cp dmg-build.log "mac-${{ matrix.name }}-build.log" || true
          cp smoke.log "mac-${{ matrix.name }}-smoke.log" || true
          gh release upload faxina-ci-logs mac-${{ matrix.name }}-*.log --clobber --repo "$GITHUB_REPOSITORY" || true

  publish:
    name: Publicar na Release
    needs: dmg
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Faxina-Mac-*
          merge-multiple: true
          path: dist
      - name: Release "faxina-mac-latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          test -n "$(ls dist/*.dmg 2>/dev/null)" || { echo "nenhum DMG para publicar"; exit 1; }
          gh release delete faxina-mac-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create faxina-mac-latest dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Faxina para Mac — instaladores mais recentes" \
            --notes "Escolha o arquivo certo: **Faxina-Mac-AppleSilicon.dmg** (chip M1/M2/M3/M4) ou **Faxina-Mac-Intel.dmg** (processador Intel). Veja faxina/README.md para instalar. Compilado do commit ${GITHUB_SHA::7} em $(date -u +'%d/%m/%Y %H:%M') UTC."
